<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>リビングの宝物さがし</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; padding:20px;}
    .container{max-width:800px;margin:0 auto}
    h1{color:#2c3e50}
    .treasure{background:#f9f9f0;padding:16px;border-radius:8px;border:1px solid #e5e5d4}
  </style>
</head>
<body>
  <div class="container">
    <h1>リビングの宝物さがし</h1>
    <p class="treasure">ようこそ！ここは「リビングの宝物さがし」ゲームのページです。下の説明に従って宝物を探しましょう。</p>

    <h2>遊び方</h2>
    <ol>
      <li>リビングの中をよく観察してください。</li>
      <li>ヒントをたよりに、隠された宝物を見つけます。</li>
      <li>見つけたら報告ボタンを押して完了です。</li>
    </ol>

    <h2>ヒント</h2>
    <ul>
      <li>いつも使う場所の近くにあるかもしれません。</li>
      <li>色や形に注目して探しましょう。</li>
    </ul>

    <button id="foundBtn">宝物を見つけた！</button>
    <p id="result" style="margin-top:12px;color:green;"></p>
  </div>

  <script>
    document.getElementById('foundBtn').addEventListener('click', function(){
      document.getElementById('result').textContent = 'おめでとうございます！宝物が見つかりました。';
    });
  </script>
</body>
</html>
